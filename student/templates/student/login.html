{% extends 'student/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Student Login</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="alert alert-error">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
